name: Tests

# Documentation-only changes do not run the tests. Not every .md is
# documentation: the examples are test inputs.
on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    env:
      PANDOC_VERSION: "3.7.0.2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath "$env:RUNNER_TEMP"
          $dir = "$env:RUNNER_TEMP\pandoc-$env:PANDOC_VERSION"
          & "$dir\pandoc.exe" --version
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -rs --cov --cov-report=term --cov-report=html

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "### Coverage: ${{ matrix.os }}, Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "No coverage data." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
