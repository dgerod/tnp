[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tnw"
dynamic = ["version"]
description = "Technical Notes Writer: manage Markdown technical notes and build them to HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "panflute>=2.3",
    "tabulate>=0.9",
]

[project.scripts]
tnw = "tnw_cli.cli:main"

[tool.hatch.version]
path = "tnw_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tnw_cli"]

# The MPE preview config lives at the repo root (mpe/) but must ship inside
# the package so an installed tnw can point VS Code at it.
[tool.hatch.build.targets.wheel.force-include]
"mpe" = "tnw_cli/mpe"
