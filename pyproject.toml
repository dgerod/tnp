[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tnp"
dynamic = ["version"]
description = "Technical Notes Publisher: manage Markdown technical notes and build them to HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "panflute>=2.3",
    "tabulate>=0.9",
]

[project.scripts]
tnp = "tnp_cli.cli:main"

[tool.hatch.version]
path = "tnp_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tnp_cli"]

# The MPE preview config lives at the repo root (mpe/) but must ship inside
# the package so an installed tnp can point VS Code at it.
[tool.hatch.build.targets.wheel.force-include]
"mpe" = "tnp_cli/mpe"

# The acceptance tests run the CLI, and pandoc runs the filters, as separate
# processes: measure them too, not just the pytest process.
[tool.coverage.run]
source = ["tnp_cli"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
